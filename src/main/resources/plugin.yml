name: LetsLearnEnglish
version: ${project.version}
main: com.letslearnenglish.minecraftplugin.LetsLearnEnglish
api-version: "${plugin.api.version}"
# ── 支持范围：MC 1.21.4 – 1.21.11 ────────────────────────────────────────
# 下限由「编译用的 paper-api 版本」决定（1.21.4），低于它可能缺 API；
# 上限由「目标 Java 版本」决定 —— Paper 从 26.x 起要求 Java 25（class major 69），
# 本项目以 Java 21 为目标，26.x 及以后的服务端根本读不了本插件的 class。
# 1.21.4–1.21.11 之间能一次编译全线运行，是因为 Bukkit API 只做加法。
# MySQL 驱动（mysql-connector-j 8.3.0）已由 maven-shade-plugin 随本包 shade 进
# 插件 JAR，服主无需手动放置驱动 jar，也无需在 server 端安装。
# 本文件参与 Maven 资源过滤，故此处只写普通注释文字。
description: "Let's learn English! - A gamified English learning plugin for Minecraft (Velocity/BungeeCord compatible)"
author: sqkl520
website: https://github.com/sqkl520/Minecraft-server-plugin-Let-s-learn-English

softdepend:
  - PlaceholderAPI
  - Vault

commands:
  learnenglish:
    description: "Main command to open the English learning menu"
    aliases: [le, learn, english]
    usage: /<command> [subcommand]
  learnadmin:
    description: "Admin command for plugin configuration and data management"
    aliases: [lea]
    usage: /<command> [subcommand]
    # 注意：此处故意不设命令级 permission——US-RPT-3 权限最小化后由
    # AdminCommand.onCommand 逐子命令判定（report 接受 letslearnenglish.report
    # 或 admin，其余子命令维持 admin）。恢复命令级 admin 门会让仅持 report
    # 权限的老师在执行器之前就被 Bukkit 拦下，/lea report 功能失效。

# ── 权限节点：只声明「代码真的会判定」的节点 ──────────────────────────────
# 每个节点都必须有对应的 hasPermission("<节点>") 调用点，反之亦然；
# 这条契约由 PermissionContractLintTest 双向钉死（改这里不补代码、或补代码不改这里，
# 都会被该 lint 判红）。
#
# 为什么删掉了 use / word.* / dialogue.* / progress.* 四个节点（D-14 收口）：
# 它们此前声明为 default: true 但全仓零 hasPermission 引用。三个 .* 节点还**没有
# children: 段**，而 Bukkit 的通配展开只发生在「声明了 children 的父节点 + 权限附件
# 计算」里（PermissibleBase.hasPermission 是纯精确名字查表，无前缀匹配）。
# 于是服主执行 `/lp user X permission set letslearnenglish.word.* false` 后，
# /le word 照常可用 —— 「配了但没生效」比没有这个节点更危险。
# 玩家功能目前意向就是「默认全开」，要按类关闭请用模块开关（word-system.enabled /
# ai-chat.enabled / progress-system.enabled 等，见 config.yml 与部署文档 5.8 节）。
permissions:
  letslearnenglish.admin:
    description: "Allows use of admin features"
    default: op
  letslearnenglish.ai.reload:
    description: "Allows reloading the AI API key and scenario file (GUI button + AI config only)"
    default: op
  letslearnenglish.scenario.import:
    description: "Allows importing shared AI scenario codes as personal scenarios"
    default: op
  letslearnenglish.report:
    description: "Allows generating student learning reports (/lea report)"
    default: op