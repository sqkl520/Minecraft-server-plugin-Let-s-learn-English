# ============================================================
#  Let's Learn English! - 主配置文件 (Main Configuration)
#  Minecraft 英语学习插件 v1.0.7
# ============================================================
#
#  说明：
#  - 修改此文件后，输入 /lea reload 即可热重载，无需重启服务器
#  - 例外：标注"需重启生效"的键为启动快照，不受 reload 影响。
#  - 所有时间单位均为分钟（除特别标注外）
#  - 颜色代码使用 & 符号（如 &a 表示绿色）
#  - 布尔值使用 true / false
#
# ============================================================

config-version: 2

# ============================================================
#  通用设置 (General Settings)
# ============================================================
general:
  # 插件默认界面语言：zh(中文) / en(英文)
  # 玩家可在主菜单中自行切换语言，此设置仅影响新玩家的默认语言
  # R-55l：此 key 缺失时所有代码回落均为 zh（与此处默认值一致，启动审计会告警缺 key）
  language: "zh"

  # 启动时联网检查版本更新
  # 关闭后不会连接 GitHub API，适合无网络的内网服务器
  # F0-08：现已真正接线——false 时跳过 UpdateChecker.checkAsync（含玩家进服的
  # 更新提示均安全静默），只记一条 info 日志
  check-updates: true

  # 自动保存间隔（分钟），玩家数据自动保存至数据库
  # 范围：1 - 60，默认 5 分钟
  # 设置过短会增加数据库写入压力，过长则存在数据丢失风险
  # 改动需重启生效（reload 不重排周期任务）。
  auto-save-interval: 5

  # 数据备份策略
  # interval: 备份间隔（分钟），0 表示禁用自动备份
  # max-backups: 保留的备份数量上限，超出后自动删除最旧的备份
  # backup.* 各键在启动时快照，改动需重启生效。
  backup:
    enabled: true
    interval: 1440
    max-backups: 7

# ============================================================
#  消息前缀 (Message Prefix)
# ============================================================
#  所有通过插件发送的聊天消息都会自动添加前缀
#  支持颜色代码（& 符号）
prefix:
  zh: "&8[&b英语学习&8] &f"
  en: "&8[&bEnglish&8] &f"

# ============================================================
#  数据库设置 (Database Settings)
# ============================================================
database:
  # 数据库类型：sqlite(本地文件) / mysql(远程数据库)
  # SQLite 无需额外配置，适合小型服务器
  # MySQL 适合多服互通数据或大型服务器
  type: "sqlite"

  # --- SQLite 配置 ---
  sqlite:
    filename: "playerdata.db"

  # --- MySQL 配置（仅 type 为 mysql 时生效）---
  mysql:
    host: "localhost"
    port: 3306
    database: "letslearnenglish"
    username: "root"
    password: ""
    # 注：本插件使用单连接（无连接池），旧 pool-size 配置项已移除（本就无效）
    # 数据库表名前缀，用于区分不同插件
    table-prefix: "lle_"

# ============================================================
#  单词学习系统 (Word Learning System)
# ============================================================
word-system:
  # 是否启用单词学习模块
  # 三层语义（Phase 3 · MC-2 真接线，/lea reload 即时生效）：
  #   入口隐藏：主菜单【单词学习】【错题本】隐藏；/le word、/le review、/le wrong 拒绝
  #   事件静默：错题本练习禁开、复习提醒停、不再分配新单词挑战
  #   数据保留：学习数据全保留；进行中的答题会话不打断（自然结束）
  enabled: true

  # 每日学习上限（个单词），0 表示不限制
  # 防止玩家过度学习，保护游戏节奏
  daily-limit: 50

  # 每个学习会话的单词数量
  # 范围：5 - 30，默认 10
  words-per-session: 10

  # 答题超时时间（秒），玩家关闭GUI后在聊天栏答题的时间限制
  # 超时后自动判定为错误并进入下一个单词
  # 范围：10 - 120，默认 30
  answer-timeout: 30

  # --- 复习系统（艾宾浩斯遗忘曲线）---
  review:
    # 是否启用间隔复习提醒
    enabled: true
    # 复习间隔（小时）：1h, 6h, 24h, 72h, 168h(7天)
    intervals: [1, 6, 24, 72, 168]
    # 掌握阈值：单词掌握度达到此值后排除出复习计划
    # 范围：0.0 - 1.0，默认 0.85
    mastery-threshold: 0.85
    # 已掌握单词低频复习周期（天）
    # 完成所有艾宾浩斯间隔后，单词进入低频复习池，每 N 天复习一次
    # 默认 30 天
    mastered-review-interval-days: 30

  # --- 学习模式配置 ---
  # Phase 3 已接线（Wave 2 · MC-3）：以下各键均被代码读取，/lea reload 即时生效
  #（判分大小写 / 选项数 / 倒计时在开局时快照，改动对下一局生效；提示显隐实时生效）。
  # 命名注意：填空模式 canonical 键名为 fill_blank（下划线）；旧名 fill-blank（连字符）
  # 仍被兼容读取（新名存在时优先），存量配置文件不失效。
  modes:
    # 拼写模式：看中文含义，输入英文单词
    spelling:
      # 是否启用该模式（false：/le word 指定该模式拒绝、tab 补全剔除、默认模式解析跳过）
      enabled: true
      # 是否区分大小写（仅影响全词文本比较：spelling/fill_blank 整词判定与 choice 的
      # "直接输全词"兜底；choice 的 A/B/C/D 字母选择恒大小写不敏感）
      case-sensitive: false

    # 选择题模式：看中文含义，从选项中选出正确答案
    choice:
      # 是否启用该模式（语义同上）
      enabled: true
      # 选项数量，读取钳位 [2, 4]（越界记一次 WARNING 并钳位）
      option-count: 4
      # 单题倒计时（秒）：0 = 跟随全局 word-system.answer-timeout；>0 = 覆盖 choice 会话
      # 单题倒计时。仅 choice 有此键；spelling/fill_blank/review 恒用全局值。
      time-limit: 0

    # 填空模式：看英文句子，填入缺少的单词
    # 旧名 fill-blank（连字符）仍兼容读取；删除本段 max-attempts 键——从未被读取，
    # 如需"每词三试"机制请单开 Story（属新机制而非配置接线）。
    fill_blank:
      # 是否启用该模式（语义同上）
      enabled: true
      # 是否显示首字母提示（false：挖空卡不渲染提示行、聊天不发 fill-blank-hint 行；
      # 题目本身与判定不变）
      show-first-letter: true

# ============================================================
#  单词对决 (Word Duel)
# ============================================================
duel:
  # 是否启用单词对决模块
  # 三层语义（Phase 3 · MC-2 真接线，/lea reload 即时生效）：
  #   入口隐藏：主菜单按钮隐藏、/le duel 发起/接受拒绝、挑战选择 GUI 不可达
  #   事件静默：新邀请不再受理；进行中的对局不打断（自然收尾）；
  #             已在局中时 quit/gui 放行（关开关后仍可退出/重开界面）
  #   数据保留：正常打完的对局写入 duel_stats（胜/负/比分/日期，保留 365 天）；
  #             中途 quit、掉线判负、管理员解散不记账；/lea duel cancel（管理员解散）保留可用
  enabled: true

# ============================================================
#  AI 情景对话系统 (AI Scenario Chat System)
# ============================================================
#  使用 DeepSeek API 提供智能英语情景对话
#  API 密钥存储在 ai_config.yml（插件数据文件夹中），不在此配置文件
ai-chat:
  # 是否启用 AI 对话模块
  # 三层语义（Phase 3 · MC-2 真接线，/lea reload 即时生效）：
  #   入口隐藏：主菜单【AI 对话】隐藏；/le dialogue 拒绝；场景选择不可达
  #   事件静默：不接新对话；进行中的对话在下一条消息收到提示后自动退出（不吞消息）
  #   数据保留：历史对话（/le history）、场景导入/管理照常可用
  # 想彻底禁用 AI 对话用本键；想限制每日轮次用下面的 daily-round-limit
  enabled: true
  # DeepSeek API 接口地址（默认使用官方 API）
  api-url: "https://api.deepseek.com/v1/chat/completions"
  # 模型名称
  model: "deepseek-chat"
  # 同时携带的最近对话轮数上限（与 token 预算双重约束）
  # 值越大对话越连贯，但每次请求消耗更多 token；R-63 起已真正接线
  max-context-pairs: 6
  # 最大上下文 token 数（近似估算，1 token ≈ 4 英文字符）
  # 当上下文 token 估算值超过此限制时，自动裁剪最早的对话轮次
  # System Prompt 永远保留，不会被裁剪
  max-context-tokens: 2000
  # HTTP 请求超时时间（秒）
  timeout-seconds: 15
  # 玩家发送消息的频率限制（秒），防止 API 滥用
  rate-limit-seconds: 3
  # 玩家输入最大长度（字符），超出部分将被截断
  max-input-length: 200
  # 调试模式：开启后在控制台输出 AI 请求/响应详情
  debug: false
  # 每个玩家每天的 AI 有效对话轮次上限，超限后当天拒绝新的 AI 对话
  # 次日（服务器时区自然日）自动清零；默认 30
  # 0 或负数 = 不限（与 word-system.daily-limit、money.daily-cap 同口径，F1-19 终案）
  # 想禁用 AI 对话请用 ai-chat.enabled: false（语义清晰），不要用 0（那是不限）
  # 注意：开场白同样计入此轮次（对话与开场白请求都算一轮；达标会话的 AI 总结走独立通道、另计）
  daily-round-limit: 30
  # 每个玩家每天可触发的 AI 开场白次数上限（打开场景时 AI 主动说的第一句）
  # 与上面 daily-round-limit 相互独立、同时生效：开场白既要过 daily-round-limit，
  # 又受本上限单独约束（先查总轮次，再查开场白次数）
  # 次日（服务器时区自然日）惰性清零；默认 30
  # 0 或负数 = 不限（同 daily-round-limit 口径）
  # 该计数为内存态（重启清零，退服重进不清零）；总花费上限仍由落库的 daily-round-limit 兜底
  opening-daily-cap: 30
  # 单次 AI 回复的最大 token 数（传给 API 的 max_tokens 参数）
  # 值越小回复越短、API 费用越低；默认 128
  max-tokens: 128
  # 一次对话至少收到 N 条有效玩家消息（非退出词、sanitize 后非空），
  # 且至少有一次成功 AI 回复，结束时才记为一次"有效对话"（用于 AI 对话成就/DailyChallenge 计数）
  # 注意：它不参与 daily-round-limit（轮次上限按每次成功 API 回复累加）；默认 3
  # 设为 0 则只要求有成功回复（不再要求玩家消息条数）
  count-min-rounds: 3

  # ---- 对话小结 / AI 学习反馈 (Session Feedback, Phase 3 US-FB) ----
  feedback:
    # 对话结束时是否显示学习小结（本地统计，零 API 成本；false 时行为与旧版一致）
    enabled: true
    # 是否追加一次 AI 总结调用（总评/纠错/推荐词）。
    # 仅在"达标会话"（有效发言 >= count-min-rounds 且至少 1 次成功回复）时触发，
    # 消耗约 1.5~2 倍单轮请求的 token；不计每日轮次、不占玩家冷却
    ai-summary: true
    # AI 总结请求的独立超时（秒），超时即降级为仅本地统计
    ai-timeout-seconds: 15
    # AI 总结请求的 max_tokens（需容纳 JSON 结构化输出；中文点评更占 token）
    ai-max-tokens: 400
    # 传给 AI 总结的对话文本上限（字符），超出只取最近部分
    transcript-max-chars: 4000
    # 聊天栏最多展示的纠错条数（完整数据仍入库，历史详情页可见全部）
    max-corrections-display: 3

# ============================================================
#  场景分享设置 (Scenario Sharing Settings)
# ============================================================
scenario:
  # 场景 Prompt 最大长度（字符），超出此限制将拒绝保存/导入
  max-prompt-length: 2000

# ============================================================
#  每日金币上限 (Daily Coin Cap)
# ============================================================
money:
  # 每个玩家每天通过本插件发放的金币总额上限
  # 超过后当天不再发币（答题仍可继续，只是不发奖励），次日（服务器时区自然日）自动清零
  # 范围：0 表示不限制；默认 500
  daily-cap: 500

# ============================================================
#  进度与奖励系统 (Progress & Reward System)
# ============================================================
progress-system:
  # 是否启用进度追踪模块（伞开关）
  # 三层语义（Phase 3 · MC-2 真接线，/lea reload 即时生效）：
  #   false 时下方排行榜 / 成就 / 奖励三个子开关全部随之关闭（内部 AND）
  #   入口隐藏：/le leaderboard、广场三榜按钮、成就墙按钮等全部隐藏/拒绝
  #   事件静默：不解锁新成就、不发奖励、不查榜
  #   数据保留：学习分数与统计继续累计；个人主页展示保留（停"伞"不停展示）
  enabled: true

  # --- 排行榜 ---
  leaderboard:
    # 三层语义（Phase 3 · MC-2）：
    #   入口隐藏：/le leaderboard、榜单 GUI、英语广场的周/月/总榜按钮隐藏
    #   事件静默：不查库；内存榜继续更新（廉价的"热备"，重开无需重启即恢复排名）
    #   数据保留：全部榜单数据保留
    enabled: true
    # 排行榜显示人数（英语广场榜单模式一次拉取的条数）
    # R-55k：此 key 缺失时启动审计会告警；代码缺 key 回落以各调用点注释为准
    display-count: 10
    # 排行榜刷新间隔（秒）。接线于 Wave 4 收尾（PF-MC-06 终案）：原硬编码 5 分钟，
    # 默认 300 = 保持原行为；下限 30 秒，上限 3600 秒。周期改动需重启生效
    # （reload 不重排任务属既有语义，任务体内照常刷新）。
    # 赛季榜快照同乘此班车（结算完成后另有即时重刷）。
    update-interval: 300

  # --- 成就系统 ---
  achievements:
    # 入口隐藏：个人主页【成就墙】按钮隐藏
    # 事件静默：不再解锁新成就（无播报/无音效/无跨服广播）
    # 数据保留：已解锁记录保留，重开后立即回归
    enabled: true

  # --- 奖励类型 ---
  rewards:
    # 奖励总门（等效金币总闸）：与 progress-system.enabled 叠加，都 true 才发
    # 入口：发币点静默（答题/挑战/签到照常推进，只是不发币）
    # 数据保留：签到仍记 streak、进度照常累计
    enabled: true
    types:
      # 经济奖励（需要 Vault 插件）
      # 语义叠加：本键 && progress-system.enabled && rewards.enabled，三者都 true 才发金币
      money:
        enabled: false
        # Wave 4 收尾（一致性审计 C-4）：原 vault-required 键零读取已删除——
        # Vault 缺失时 RewardEngine.isMoneyEnabled 已自动为 false（检测驱动，无需开关）。
        # 每答对一题获得的基础金币数
        base-amount: 10.0
        # Combo 倍率是否影响金币奖励（金币 = base-amount × combo-multiplier）
        combo-bonus: true
        # 学习会话完成时的额外奖励金币
        session-complete-bonus: 50.0
        # 达到最高连击时的额外奖励（会话结算时发放）
        max-combo-bonus: 25.0
        # 复习模式金币倍率（相对于 base-amount）
        # 默认 1.2：复习是间隔重复，比首学更值得鼓励，给正向加成
        # （Phase 2 FIX-NUM-01 反转：旧默认 0.5 等于惩罚复习，没人愿意点复习）
        review-multiplier: 1.2
        # 复习模式答错是否扣除金币
        # 默认 false：复习答错已进错题本纠错，不再倒扣金币双重惩罚
        # （Phase 2 FIX-NUM-01 反转：旧默认 true，试运行反馈"复习越学越穷"）
        review-penalty: false
        # 复习模式答错扣除的金币数
        review-penalty-amount: 5.0

# ============================================================
#  GUI 界面设置 (GUI Settings)
# ============================================================
gui:
  # 菜单大小：27 / 36 / 45 / 54（按钮布局固定 10-18 槽、含 12/16 新增的对决/签到按钮，
  # 至少需要 27 格；9/18 会因按钮越界在打开菜单时崩溃，故非法值一律回落 27 并记 WARNING）
  menu-size: 27

  # --- 音效设置 ---
  # enabled: 是否启用 GUI 操作音效
  # 音效名称参考 Minecraft 官方音效列表
  sounds:
    enabled: true
    correct: "ENTITY_PLAYER_LEVELUP"           # 回答正确音效
    incorrect: "ENTITY_VILLAGER_NO"            # 回答错误音效
    complete: "UI_TOAST_CHALLENGE_COMPLETE"    # 学习完成音效
    menu-open: "BLOCK_NOTE_BLOCK_PLING"        # 菜单打开音效
    menu-click: "BLOCK_NOTE_BLOCK_HAT"         # 菜单点击音效
    # --- Phase 3 新增（旧配置文件缺键自动用默认值注册，无需迁移）---
    combo-milestone: "BLOCK_NOTE_BLOCK_BELL"   # 连击里程碑铃声
    countdown-tick: "BLOCK_NOTE_BLOCK_HAT"     # 倒计时 tick（学习+对决共用）
    timeout: "ENTITY_VILLAGER_NO"              # 超时专用（学习+对决）；与 incorrect 缺省同音
    # 以上任一配 "none" 或空串 "" 表示该事件静音，不记 WARNING

# ============================================================
#  反馈层设置 (Feedback Settings)
# ============================================================
feedback:
  countdown:
    # 剩余秒数 ≤ 该值切"紧急"样式（红色 + tick 音）；学习与对决共用
    urgent-seconds: 5
    # 最后 N 秒每秒播 countdown-tick；0 = 不播
    tick-sound-seconds: 3
    # 对决每题是否显示 BossBar 倒计时条
    duel-bossbar: true
  combo:
    # 答对音随连击升高 pitch
    pitch-enabled: true
    pitch-step: 0.10
    pitch-max: 1.6
    # 连击里程碑（3/5/7/10，与倍率表同源）ActionBar + 音效提示
    milestone-enabled: true

# ============================================================
#  GUI 界面布局设置 (GUI Layout Settings)
# ============================================================
#  自定义各界面中的物品材质和位置
#  - slot: 物品在界面中的格子位置（0-53，主菜单0-26）
#  - material: Minecraft 物品材质名称
#  完整材质列表参考: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Material.html
gui-layout:
  main-menu:
    word-learning:
      slot: 11
      material: "BOOK"
    dialogue-practice:
      slot: 13
      material: "PAPER"
    personal-profile:
      slot: 15
