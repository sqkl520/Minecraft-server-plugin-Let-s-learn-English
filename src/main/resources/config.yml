# ============================================================
#  成就系统设置 (Achievement System)
# ============================================================
achievement-system:
  # 解锁成就时播放的音效（留空则不播放）
  unlock-sound: "ENTITY_PLAYER_LEVELUP"

# ============================================================
#  代理网络设置 (Proxy Network Settings)
# ============================================================
#  用于 Velocity / BungeeCord 等多服代理网络环境
#  注：跨服消息通道（成就解锁广播 / 全服公告接收）由 ProxyMessenger 在
#  检测到代理环境后无条件注册，无独立开关（旧 cross-server-announcements /
#  cross-server-messages 两项从未被代码读取，已移除）。
proxy:
  # 本子服在代理网络中的服务器名（与 BungeeCord/Velocity 配置一致）。
  # 用于跨服广播回环去重（赛季结算/开始子通道）；留空 = 单服模式
  # （回环语义退化为"可能重复播报一次"，奖励发放仍受台账幂等保护）。
  server-name: ""

# ============================================================
#  每日学习提醒 (Daily Study Reminder)
# ============================================================
daily-reminder:
  # 是否启用每日学习提醒
  # 关闭后：定时提醒与进服提醒（on-join）都不再发送
  # enabled 可经 /lea reload 即时生效；reminder-hours 为启动快照，改动需重启。
  enabled: true
  # 玩家进服时是否发送学习提醒（R-86p：现已接线）
  # 开启后，同一玩家每个自然日首次进服会收到一条鼓励学习消息（每日去重，repeat 进服不打扰）
  on-join: true
  # 提醒时间（24小时制的小时数），可设置多个时间点
  # 例如 [9, 14, 20] 表示早9点、下午2点、晚8点各提醒一次
  reminder-hours: [9, 14, 20]
  # 提醒消息（支持 {player} 玩家名 / {prefix} 前缀 占位符，R-86p 起逐玩家替换，两种通道共用）
  message: "{prefix}&6是时候学英语了！输入 &e/le menu &6开始学习吧！"

# ============================================================
#  每日挑战 (Daily Challenges)
# ============================================================
daily-challenges:
  # 是否启用每日挑战
  # 三层语义（Phase 3 · MC-2 真接线，/lea reload 即时生效）：
  #   入口隐藏：主菜单【每日挑战】按钮隐藏；/le challenge 拒绝；领取分支拒绝
  #   事件静默：不再分配新挑战、不更新进度、午夜 rollover 跳过挑战段落
  #   数据保留：既有挑战行保留，重开后继续
  enabled: true
  # 每天分配给每个玩家的任务挑战数量
  # 分配数量（1-4，受可用类型数限制）：超出 [1,4] 会被钳位并告警；
  # 无 AI Key 等导致可用类型不足时按可用数分配（如配 4 只得 3）。
  # Phase 3 · MC-5 起真接线，/lea reload 即时生效（默认 3 = 原硬编码行为）。
  challenges-per-day: 3
  # 每日单词挑战数量（从词库中随机选择）
  word-count: 5
  # 完成所有每日单词挑战后的奖励金币
  word-challenge-reward: 100.0
  # 各挑战的奖励金币数
  # 每类挑战奖励金币（缺键/非法回落内置默认 30/50/25/40）；
  # ≤0 视为非法同样回落默认（避免"0 金币死领取"）；/lea reload 即时生效。
  rewards:
    answer_10: 30
    session_3: 50
    combo_5: 25
    ai_chat_5: 40

# ============================================================
#  每日签到 (Daily Check-in)
# ============================================================
checkin:
  # 是否启用每日签到模块
  # 三层语义（Phase 3 · MC-2 真接线，/lea reload 即时生效）：
  #   入口隐藏：主菜单按钮隐藏、/le checkin 拒绝
  #   事件静默：不记新签到
  #   数据保留：签到记录保留；停用期间连续签到会自然断签（预期语义）
  enabled: true

# ============================================================
#  新手引导 (Onboarding)
# ============================================================
onboarding:
  # 是否启用新手引导线（首次 3 步：选词库 → 3 词迷你会话 → 查看成就）
  # 真接线：false 时不给引导书、拦截不生效、无任何提醒（四处门槛同源）
  enabled: true
  # 迷你会话单词数（复用选择题模式；答错原地重试，不判错不推进）
  session-words: 3
  # 是否在首次进服发放《新手引导手册》（WRITTEN_BOOK）
  give-guide-book: true
  # 第 3 步（打开个人主页）是否必需；false = 迷你会话完成即整段完成并发 complete 文案
  require-profile-step: true
  # 引导完成时是否收回手册；false = 留作纪念（翻页显示毕业页）
  remove-book-on-complete: true
  # 未完成引导的玩家进服时是否提醒（同一玩家同一自然日至多一条）
  reminder-on-join: true

# ============================================================
#  TTS 语音设置 (Text-to-Speech Settings)
# ============================================================
#  单词发音辅助功能：在 GUI 中显示音标符号，并播放音符盒提示音
#  当前版本不播放真实语音：点击发音按钮只会响一声提示音（BLOCK_NOTE_BLOCK_PLING）；
#  VoiceRSS 下载的 .wav 仅缓存到 audio/ 目录，供未来资源包集成预留，插件不会播放它。
#  音标显示为主要功能；音频下载需要 VoiceRSS API 密钥（免费注册）
#  R10-M5：enabled / cache-days / voicerss-api-key 为启动快照（TtsManager 构造读取），
#  改动需重启生效（reload 不重建）；pronounce-cooldown-seconds 为点读，reload 即时生效。
tts:
  # 是否启用发音功能（至少显示音标符号）
  enabled: true
  # 音频缓存保留天数，过期后自动清理
  cache-days: 7
  # VoiceRSS API 密钥（留空则不下载 .wav 音频，仅显示音标与提示音）
  # 免费注册: https://www.voicerss.org/registration.aspx
  voicerss-api-key: ""
  # 发音按钮冷却（秒）：同一玩家两次点击发音按钮的最小间隔，防连点刷 API
  # 冷却内点击只提示不发请求；默认 5 秒
  pronounce-cooldown-seconds: 5

# ============================================================
#  难度等级 (Difficulty Levels)
# ============================================================
#  注：旧 difficulty-settings 段（available/display-names）已整体移除 —— 难度等级
#  由 words/*.yml 自动发现，显示名走 messages/*.yml（word.difficulty-*），
#  该段配置从未被代码读取。

# ============================================================
#  统计仪表盘 HTTP 服务器 (Statistics Dashboard HTTP Server)
# ============================================================
#  为管理员提供一个 Web 仪表盘，展示学习统计数据与图表
#  使用 Java 内置 HttpServer，无需额外 HTTP 依赖
#  R9-M1：本节各键在服务构造时读取；/lea reload 会自动重启统计服务，
#  enabled/port/认证等改动经 reload 生效（无需整服重启）。
statistics-server:
  # 是否启用统计 HTTP 服务器
  enabled: false
  # 默认仅允许本机访问；需要局域网访问时显式改为服务器内网地址
  bind-address: "127.0.0.1"
  # 监听端口
  port: 8080
  # IP 白名单（支持 CIDR 表示法，如 192.168.1.0/24）
  # 不在白名单中的 IP 将收到 403 Forbidden
  ip-whitelist:
    - "127.0.0.1"
    - "192.168.1.0/24"
  # HTTP Basic Auth 认证
  auth:
    username: "admin"
    password: "changeme"

# ============================================================
#  学习报告 (Learning Report)
# ============================================================
# 家长/老师学习报告：/lea report <玩家|all> [week|lastweek|<N>d]
# 报告文件为纯文本 TXT（UTF-8 + BOM + CRLF），强制中文（language 可配），
# 落 plugins/LetsLearnEnglish/exports/reports/ —— 由老师/服主自行转发给家长。
report:
  # 是否启用 /lea report 报告功能。false 时命令提示 report.disabled（真接线，非静默 no-op）
  enabled: true
  # 默认统计周期: week(本周一~今天) / lastweek(上一完整周)
  # 命令行的周期参数可覆盖；家长抽查可用 7d/30d 形式
  period: "week"
  # 报告文件语言（给家长看，独立于玩家与执行者语言）: zh / en
  language: "zh"
  # 时长估算系数: 每题折合的分钟数（默认 0.5 = 每题 30 秒，与 answer-timeout 默认一致）
  minutes-per-question: 0.5
  # 报告文件保留天数（exports/reports/report_*.txt 的清理阈值），0 = 不清理
  keep-days: 30
  # 是否尊重玩家隐私开关（showInSquare）。
  # false（默认）= 报告属管理/监护通道，不受玩家展示开关约束 —— 权限即同意边界；
  # true = 隐身玩家不出现在批量报告、单报拒发（与榜单过滤同口径）
  respect-privacy: false
  batch:
    # /lea report all 的单次最大玩家数（按窗口内活跃人数取前 N，超出截断并标注）
    max-players: 50
  # 错题列表截断长度（报告文件与批量逐人小节）
  weak-words-limit: 5

# ============================================================
#  广场社交 (Square Social) — Wave 2（域 4）
# ============================================================
social:
  # 是否启用广场社交（动态流 + 鼓励）。false 时：不产生动态、动态按钮隐藏、
  # 鼓励点击无效、进服摘要不发（四处接线，非静默 no-op）
  enabled: true
  feed:
    # 动态保留天数，过期动态连同其鼓励记录一并清理；0 表示永久保留（不推荐）
    retention-days: 7
  cheer:
    # 是否启用鼓励按钮
    enabled: true
    # 连续点击防抖（毫秒），防宏连点
    click-debounce-ms: 750
  # 玩家进服时提示"离线期间收到的鼓励"
  notify-on-join: true

english-square:
  # 广场打开时的默认模式: feed（动态流，推荐）/ all（玩家列表）
  default-mode: "feed"

# ============================================================
#  赛季系统 (Season System) — Wave 3（域 5 批次 A）
# ============================================================
#  窗口 = 锚点 + 固定时长纯函数推导（本地日粒度，停服/漂移不累计误差）。
#  赛季榜 = player_sessions 的时间窗口视图（零数据重置，总榜不动）；
#  结算台账 = seasons / season_rewards 两表（多服连同一库时条件 UPDATE 抢占单发）。
#  主 config（config-version: 2）无迁移机制，新键靠读取点 getX(key, default) 兜底。
season:
  # 是否启用赛季（关闭时：无结算调度、无赛季 tab、无广播、PAPI 返回空）
  # 默认关：运营属性功能，先让用户确认再开（对齐 money.enabled 先例）
  enabled: false
  # 单季时长（天）。所有边界由 anchor-date 纯函数推导，停服/漂移不累计误差；
  # 锚点在未来（或首次误配）时全系统视为"赛季未开启"，所有赛季功能休眠
  # R7-L2：修改 duration-days/anchor-date 会使已建立的赛季行与现推导窗口不一致，
  # 可能提前/跳过结算；多子服必须同步修改并同时 reload。
  duration-days: 30
  # 首季开始日（服务器本地时区，yyyy-MM-dd）。修改本键 = 重定义全局赛季轴，慎改；
  # 多子服必须同 host 时区（不同时区边界会错位，最坏 = 一服多结算一空季，
  # 抢占语义保证不重复发奖）
  anchor-date: "2026-11-02"
  # 结算奖励分层（金币；需 Vault，无 Vault 只公告不发钱——静默降级）。
  # 赛季奖励不走 money.daily-cap（一次性、有排名门槛、台账幂等防重），
  # 直发 Vault + lifetime 记账，不挤占当日答题额度
  rewards:
    enabled: true
    top1: 5000.0
    top3: 2000.0          # 第 2-3 名
    top10: 500.0          # 第 4-10 名
    # R7-M1 规模提示（C2-C 规格委托 D4 批）：开启后结算将为本窗口全部活跃玩家建台账，大服注意。
    participated: 0.0     # 参与奖（>0 时窗口内有过会话即发；含隐身者——发放不受展示开关约束）
  # 开始/结束是否全服广播（跨服经 ProxyMessenger 子通道，见 proxy.server-name）
  announce: true

# ============================================================
#  班级系统 (Class System) — Wave 4（域 6 批次 4A）
# ============================================================
#  管理型班级（"老师=OP 开好班级"模式；不做玩家自建/邀请/审批）。
#  一人一班：加入新班自动退出旧班并提示。数据层 classes / class_members 两表。
class-system:
  # 是否启用班级系统（关闭时：/lea class 全部子命令给 class.disabled，
  # 玩家侧班级入口隐藏）。默认关：运营属性功能，先让用户确认再开
  # （对齐 season.enabled / money.enabled 先例）
  enabled: false
  # 班名最大长度（1 ~ 本值个字符；不能含空格）
  max-name-length: 32
  # 单班成员上限（/lea class add 达到上限时拒绝，防丢班——换班时先判新班满再动旧班）
  max-members: 50
