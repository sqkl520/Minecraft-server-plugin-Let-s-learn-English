    language-toggle:
      slot: 18
      material: "RED_BED"
    daily-challenge:
      slot: 10
      material: "WRITABLE_BOOK"
  word-learning:
    back-button:
      slot: 8
      material: "RED_STAINED_GLASS_PANE"
    progress-info:
      slot: 4
      material: "CLOCK"
    combo-info:
      slot: 10
      material: "BLAZE_ROD"
    current-word:
      slot: 13
      material: "BOOK"
    stop-button:
      slot: 16
      material: "BARRIER"
    pronunciation-button:
      slot: 14
      material: "NOTE_BLOCK"
    start-button:
      slot: 22
      material: "LIME_DYE"
  english-square:
    back-button:
      slot: 8
      material: "RED_STAINED_GLASS_PANE"
    prev-page:
      slot: 47
      material: "ARROW"
    next-page:
      slot: 51
      material: "ARROW"
    empty-icon:
      slot: 22
      material: "BOOK"
    mode-weekly:
      slot: 2
      material: "CLOCK"
    mode-monthly:
      slot: 3
      material: "BOOK"
    mode-alltime:
      slot: 4
      material: "GOLD_INGOT"
    mode-all:
      slot: 5
      material: "PLAYER_HEAD"
  profile:
    border-material: "BLACK_STAINED_GLASS_PANE"
    back-button:
      slot: 8
      material: "RED_STAINED_GLASS_PANE"
    player-head:
      slot: 4
      material: "PLAYER_HEAD"
    age:
      slot: 13
      material: "CAKE"
    words-learned:
      slot: 11
      material: "BOOK"
    accuracy:
      slot: 12
      material: "EXPERIENCE_BOTTLE"
    sessions:
      slot: 14
      material: "CLOCK"
    coins:
      slot: 15
      material: "GOLD_INGOT"
    settings-button:
      slot: 26
      material: "COMPARATOR"
    settings-back-button:
      slot: 8
      material: "RED_STAINED_GLASS_PANE"
    settings-toggle-on:
      material: "LIME_DYE"
    settings-toggle-off:
      material: "GRAY_DYE"
