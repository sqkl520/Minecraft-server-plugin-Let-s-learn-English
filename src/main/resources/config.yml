# ============================================================
#  Let's Learn English! - 主配置文件 (Main Configuration)
#  Minecraft 英语学习插件 v1.0.6
# ============================================================
#
#  说明：
#  - 修改此文件后，输入 /lea reload 即可热重载，无需重启服务器
#  - 所有时间单位均为分钟（除特别标注外）
#  - 颜色代码使用 & 符号（如 &a 表示绿色）
#  - 布尔值使用 true / false
#
# ============================================================

config-version: 2

# ============================================================
#  通用设置 (General Settings)
# ============================================================
general:
  # 插件默认界面语言：zh(中文) / en(英文)
  # 玩家可在主菜单中自行切换语言，此设置仅影响新玩家的默认语言
  language: "zh"

  # 调试模式：开启后会在控制台输出详细日志
  # 建议仅在排查问题时开启，正常运行请关闭以节省性能
  debug: false

  # 启动时联网检查版本更新
  # 关闭后不会连接 GitHub API，适合无网络的内网服务器
  check-updates: true

  # 自动保存间隔（分钟），玩家数据自动保存至数据库
  # 范围：1 - 60，默认 5 分钟
  # 设置过短会增加数据库写入压力，过长则存在数据丢失风险
  auto-save-interval: 5

  # 数据备份策略
  # interval: 备份间隔（分钟），0 表示禁用自动备份
  # max-backups: 保留的备份数量上限，超出后自动删除最旧的备份
  backup:
    enabled: true
    interval: 1440
    max-backups: 7

# ============================================================
#  消息前缀 (Message Prefix)
# ============================================================
#  所有通过插件发送的聊天消息都会自动添加前缀
#  支持颜色代码（& 符号）
prefix:
  zh: "&8[&b英语学习&8] &f"
  en: "&8[&bEnglish&8] &f"

# ============================================================
#  数据库设置 (Database Settings)
# ============================================================
database:
  # 数据库类型：sqlite(本地文件) / mysql(远程数据库)
  # SQLite 无需额外配置，适合小型服务器
  # MySQL 适合多服互通数据或大型服务器
  type: "sqlite"

  # --- SQLite 配置 ---
  sqlite:
    filename: "playerdata.db"

  # --- MySQL 配置（仅 type 为 mysql 时生效）---
  mysql:
    host: "localhost"
    port: 3306
    database: "letslearnenglish"
    username: "root"
    password: ""
    # MySQL 连接池大小，建议 5-20
    pool-size: 10
    # 数据库表名前缀，用于区分不同插件
    table-prefix: "lle_"

# ============================================================
#  单词学习系统 (Word Learning System)
# ============================================================
word-system:
  # 是否启用单词学习模块
  enabled: true

  # 每日学习上限（个单词），0 表示不限制
  # 防止玩家过度学习，保护游戏节奏
  daily-limit: 50

  # 每个学习会话的单词数量
  # 范围：5 - 30，默认 10
  words-per-session: 10

  # 答题超时时间（秒），玩家关闭GUI后在聊天栏答题的时间限制
  # 超时后自动判定为错误并进入下一个单词
  # 范围：10 - 120，默认 30
  answer-timeout: 30

  # --- 复习系统（艾宾浩斯遗忘曲线）---
  review:
    # 是否启用间隔复习提醒
    enabled: true
    # 复习间隔（小时）：1h, 6h, 24h, 72h, 168h(7天)
    intervals: [1, 6, 24, 72, 168]
    # 掌握阈值：单词掌握度达到此值后排除出复习计划
    # 范围：0.0 - 1.0，默认 0.85
    mastery-threshold: 0.85
    # 已掌握单词低频复习周期（天）
    # 完成所有艾宾浩斯间隔后，单词进入低频复习池，每 N 天复习一次
    # 默认 30 天
    mastered-review-interval-days: 30

  # --- 学习模式配置 ---
  modes:
    # 拼写模式：看中文含义，输入英文单词
    spelling:
      enabled: true
      max-attempts: 3
      case-sensitive: false          # 是否区分大小写

    # 选择题模式：看中文含义，从选项中选出正确答案
    choice:
      enabled: true
      option-count: 4                # 选项数量
      time-limit: 30                 # 答题时限（秒），0 不限制

    # 填空模式：看英文句子，填入缺少的单词
    fill-blank:
      enabled: true
      show-first-letter: true        # 是否显示首字母提示
      max-attempts: 3

# ============================================================
#  AI 情景对话系统 (AI Scenario Chat System)
# ============================================================
#  使用 DeepSeek API 提供智能英语情景对话
#  API 密钥存储在 ai_config.yml（插件数据文件夹中），不在此配置文件
ai-chat:
  # 是否启用 AI 对话模块
  enabled: true
  # DeepSeek API 接口地址（默认使用官方 API）
  api-url: "https://api.deepseek.com/v1/chat/completions"
  # 模型名称
  model: "deepseek-chat"
  # 最大对话上下文对数（保留最近 N 轮对话）
  # 值越大对话越连贯，但每次请求消耗更多 token
  max-context-pairs: 6
  # 最大上下文 token 数（近似估算，1 token ≈ 4 英文字符）
  # 当上下文 token 估算值超过此限制时，自动裁剪最早的对话轮次
  # System Prompt 永远保留，不会被裁剪
  max-context-tokens: 2000
  # HTTP 请求超时时间（秒）
  timeout-seconds: 15
  # 玩家发送消息的频率限制（秒），防止 API 滥用
  rate-limit-seconds: 3
  # 玩家输入最大长度（字符），超出部分将被截断
  max-input-length: 200
  # 调试模式：开启后在控制台输出 AI 请求/响应详情
  debug: false

# ============================================================
#  进度与奖励系统 (Progress & Reward System)
# ============================================================
progress-system:
  # 是否启用进度追踪模块
  enabled: true

  # --- 排行榜 ---
  leaderboard:
    enabled: true
    # 排行榜显示人数
    display-count: 10
    # 排行榜刷新间隔（秒）
    update-interval: 30

  # --- 成就系统 ---
  achievements:
    enabled: true
    config-file: "achievements-config.yml"

  # --- 奖励类型 ---
  rewards:
    enabled: true
    types:
      # 物品奖励
      item:
        enabled: true
      # 指令奖励（允许执行自定义指令作为奖励）
      command:
        enabled: true
      # 经验值奖励
      exp:
        enabled: true
      # 经济奖励（需要 Vault 插件）
      money:
        enabled: false
        vault-required: true
        # 每答对一题获得的基础金币数
        base-amount: 10.0
        # Combo 倍率是否影响金币奖励（金币 = base-amount × combo-multiplier）
        combo-bonus: true
        # 学习会话完成时的额外奖励金币
        session-complete-bonus: 50.0
        # 达到最高连击时的额外奖励（会话结算时发放）
        max-combo-bonus: 25.0
        # 复习模式金币倍率（相对于 base-amount），设为 0.5 表示复习奖励为学习的一半
        review-multiplier: 0.5
        # 复习模式答错是否扣除金币
        review-penalty: true
        # 复习模式答错扣除的金币数
        review-penalty-amount: 5.0

# ============================================================
#  GUI 界面设置 (GUI Settings)
# ============================================================
gui:
  # 主菜单标题（颜色代码使用 & 符号）
  main-menu-title: "&6&lLet's Learn English!"
  # 菜单大小：9 / 18 / 27 / 36 / 45 / 54
  menu-size: 27
  # 是否使用自定义材质（需要额外的资源包）
  custom-textures: false

  # --- 音效设置 ---
  # enabled: 是否启用 GUI 操作音效
  # 音效名称参考 Minecraft 官方音效列表
  sounds:
    enabled: true
    correct: "ENTITY_PLAYER_LEVELUP"           # 回答正确音效
    incorrect: "ENTITY_VILLAGER_NO"            # 回答错误音效
    complete: "UI_TOAST_CHALLENGE_COMPLETE"    # 学习完成音效
    menu-open: "BLOCK_NOTE_BLOCK_PLING"        # 菜单打开音效
    menu-click: "BLOCK_NOTE_BLOCK_HAT"         # 菜单点击音效

# ============================================================
